<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mission App</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p style="color: #8b949e; font-weight: 500;">Initializing Dashboard...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display: none; opacity: 0; transition: opacity 0.25s ease;">
    <h1 id="app-time-heading">MISSION</h1>

    <nav id="app-navigation-container" class="section-buttons">
        <button data-target="study" class="nav-button">Study Tracker</button>
        <button data-target="timetable" class="nav-button">Weekly Timetable</button>
        <button data-target="dashboard" class="nav-button">Dashboard</button>
        <button data-target="topstudent" class="nav-button">Top Student Mode</button>
        <button data-target="sunnah" class="nav-button">Sunnah Tracker</button>
    </nav>

    <div id="grade-progress-container" style="width: 100%; box-sizing: border-box; padding: 0 4px;">
        <div id="grade-progress-bar"></div>
    </div>

    <main id="main-content"></main>

    </div>

<script src="cordova.js"></script>
<script src="./data.js"></script>
<script src="./Storage-bridge.js"></script> 
<script src="./Study-tracker.js"></script>
<script src="./weekly-timetable.js"></script>
<script src="./dashboard.js"></script>
<script src="./top-student-mode.js"></script>
<script src="./Sunnah-tracker.js"></script>
<script src="./main.js"></script>

<script>
"use strict";

window.addEventListener("DOMContentLoaded", async () => {
    // 1. Navigation Event Delegation
    const navContainer = document.getElementById("app-navigation-container");
    if (navContainer) {
        navContainer.addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (btn && btn.dataset.target) {
                window.loadSection(btn.dataset.target, window.UI.load().grade);
            }
        });
    }

    // 2. Initialize Visibility state
    const lastUI = window.UI.load();
    const prog = document.getElementById("grade-progress-container");
    if (prog) {
        prog.style.display = (lastUI.section === 'study') ? 'block' : 'none';
    }

    // 3. Splash Screen Logic
    const hideSplash = () => {
        const splash = document.getElementById("splash-screen");
        const app = document.getElementById("app");
        if (splash && app) {
            splash.classList.add("hide");
            app.style.display = "block";
            setTimeout(() => { app.style.opacity = "1"; }, 50);
            setTimeout(() => { splash.remove(); }, 300);
        }
    };

    if (window.cordova) {
        document.addEventListener("deviceready", hideSplash, false);
    } else {
        setTimeout(hideSplash, 350);
    }
});
</script>
</body>
</html>
