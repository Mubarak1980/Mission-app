<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    />
    <title>Mission App</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <meta name="theme-color" content="#0b0f14" />
    <meta name="background-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission App">
    <meta name="application-name" content="Mission App">
    <meta name="format-detection" content="telephone=no">

    <style>
        html, body {
            background-color: #0b0f14 !important;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<button
    id="installBtn"
    aria-label="Install Mission App"
    style="
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        right: calc(20px + env(safe-area-inset-right, 0px));
        padding: 14px 20px;
        border: none;
        background: #00d4ff;
        color: #05070a;
        font-weight: 700;
        font-size: 0.95rem;
        border-radius: 14px;
        display: none;
        z-index: 99999;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        touch-action: manipulation;
        transition: transform 0.1s ease;
    "
>
    📲 Install App
</button>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p style="color: #8b949e; font-weight: 500; letter-spacing: 0.5px;">Loading System Engine...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display: none; opacity: 0; transition: opacity 0.25s ease;">
    
    <h1 id="app-time-heading">TIME</h1>

    <div class="section-buttons">
        <button onclick="loadSection('study', getCurrentGradeSafe())">Study Tracker</button>
        <button onclick="loadSection('timetable')">Weekly Timetable</button>
        <button onclick="loadSection('dashboard')">Dashboard</button>
        <button onclick="loadSection('top-student')">Top Student Mode</button>
        <button onclick="loadSection('sunnah')">Sunnah Tracker</button>
    </div>

    <div id="grade-progress-bar"></div>

    <main id="main-content"></main>

    <div id="grade-nav">
        <button onclick="previousGrade()" id="prev-btn">Previous</button>
        <button onclick="nextGrade()" id="next-btn">Next</button>
    </div>
</div>

<script src="./data.js" defer></script>
<script src="./Study-tracker.js" defer></script>
<script src="./weekly-timetable.js" defer></script>
<script src="./dashboard.js" defer></script>
<script src="./top-student-mode.js" defer></script>
<script src="./Sunnah-tracker.js" defer></script>
<script src="./main.js" defer></script>

<script>
"use strict";

/* ==========================================================
   📦 ARCHITECTURAL GLOBAL STATE STATE INITIALIZATION
   ========================================================== */
let deferredPrompt = null;

/* ==========================================================
   📱 ELITE NATIVE STANDALONE DETECTION ENGINE
   ========================================================== */
function isRunningStandalone() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true ||
        document.referrer.includes("android-app://") ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches
    );
}

function getCurrentGradeSafe() {
    return window.UI?.currentGrade || 9;
}

/* ==========================================================
   ⚙️ VISUAL INTERACTION HANDLERS (INSTALL UI)
   ========================================================== */
function showInstallButton() {
    const btn = document.getElementById("installBtn");
    if (!btn) return;

    if (isRunningStandalone()) {
        btn.style.setProperty("display", "none", "important");
        return;
    }
    btn.style.display = "block";
}

function hideInstallButton() {
    const btn = document.getElementById("installBtn");
    if (!btn) return;
    btn.style.setProperty("display", "none", "important");
}

window.showInstallButton = showInstallButton;
window.hideInstallButton = hideInstallButton;

/* ==========================================================
   🛑 SYSTEM DEFENSIVE NATIVE BANNER INTERCEPTION
   ========================================================== */
window.addEventListener("beforeinstallprompt", (e) => {
    // Kills native automatic bottom browser prompt sheets completely
    e.preventDefault();
    
    if (isRunningStandalone()) return false;

    deferredPrompt = e;
    showInstallButton();
    console.log("✅ PWA Native Install Engine intercepted & bound successfully.");
    return false;
});

function setupInstallButton() {
    const installBtn = document.getElementById("installBtn");
    if (!installBtn) return;

    installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) {
            alert("App engine preparation incomplete. Hold on a brief moment or access your browser settings menu to install!");
            return;
        }
        try {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            console.log("📲 Install application decision recorded:", result.outcome);
            deferredPrompt = null;
            hideInstallButton();
        } catch (err) {
            console.error("🔥 Installation engine crashed:", err);
        }
    });

    // Tap scale bounce feedback animation
    installBtn.addEventListener("touchstart", () => installBtn.style.transform = "scale(0.95)");
    installBtn.addEventListener("touchend", () => installBtn.style.transform = "scale(1)");
}

window.addEventListener("appinstalled", () => {
    console.log("🚀 High honor! Mission App installed directly to localized workspace.");
    deferredPrompt = null;
    hideInstallButton();
});

/* ==========================================================
   ⏳ HARDWARE ACCELERATED SPLASH TRANSITION VIEW
   ========================================================== */
function hideSplashScreen() {
    const splash = document.getElementById("splash-screen");
    const app = document.getElementById("app");
    if (!splash || !app) return;

    splash.classList.add("hide");
    app.style.display = "block";
    
    // Smooth transition to mitigate text clipping jumps
    setTimeout(() => {
        app.style.opacity = "1";
    }, 50);

    setTimeout(() => {
        if (splash.parentNode) {
            splash.remove();
        }
    }, 300);
}

/* ==========================================================
   🌐 ENTERPRISE SERVICE WORKER SYNC ENGINE
   ========================================================== */
async function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) {
        console.warn("⚠️ Localized system platform environment does not support background worker scopes.");
        return;
    }
    try {
        const registration = await navigator.serviceWorker.register(
            "./service-worker.js", // Sanitized relative root pathways to solve GitHub pages resolution faults
            { scope: "./" }
        );

        console.log("🎯 Service Worker lifecycle hooked:", registration.scope);

        // Lifecycle updates checking block running in secondary background thread
        setInterval(() => {
            if (navigator.onLine) {
                registration.update().catch(() => console.log("SW check skipped while user workspace is offline."));
            }
        }, 1000 * 60 * 30); // Checks every 30 minutes seamlessly

    } catch (err) {
        console.error("❌ Service Worker execution fault encountered:", err);
    }
}

// Global atomic single-instance controller switch to halt reload loops
let isRefreshing = false;
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (isRefreshing) return;
        isRefreshing = true;
        window.location.reload();
    });
}

/* ==========================================================
   🚀 SYSTEM BOOTSTRAP PIPELINE INITIALIZER
   ========================================================== */
window.addEventListener("DOMContentLoaded", async () => {
    try {
        // Enforce structural boundary checks right out the gate
        if (isRunningStandalone()) {
            hideInstallButton();
        }
        
        setupInstallButton();
        await registerServiceWorker();

        // Delays splash tear-down slightly until script engines compute layout widths
        setTimeout(hideSplashScreen, 450);
        console.log("🔥 Mission Application initialization routine finalized.");
    } catch (err) {
        console.error("🛑 Operational system deployment initialization aborted:", err);
    }
});
</script>
</body>
    </html>
