<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    />
    <title>Mission App</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <meta name="theme-color" content="#0b0f14" />
    <meta name="background-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission App">
    <meta name="application-name" content="Mission App">
    <meta name="format-detection" content="telephone=no">

    <style>
        html, body {
            background-color: #0b0f14 !important;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div 
    id="pwa-install-banner" 
    style="
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%) translateY(-150%);
        width: calc(100% - 24px);
        max-width: 460px;
        background: #121821;
        border: 1px solid #1f2a36;
        border-top: 3px solid #00d4ff;
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
    "
>
    <div style="display: flex; align-items: center; gap: 12px;">
        <img src="./icon-192.png" alt="App Icon" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;" onerror="this.style.display='none'">
        <div>
            <div style="font-weight: 700; font-size: 0.95rem; color: #e6edf3; margin-bottom: 2px;">Mission App</div>
            <div style="font-size: 0.8rem; color: #8b949e;">Install to track offline smoothly</div>
        </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
        <button id="pwa-close-btn" style="background: transparent; border: none; color: #8b949e; font-size: 0.85rem; padding: 8px; cursor: pointer; font-weight: 500;">Later</button>
        <button id="pwa-action-btn" style="background: #00d4ff; border: none; color: #05070a; font-weight: 700; font-size: 0.85rem; padding: 8px 14px; border-radius: 8px; cursor: pointer;">Install</button>
    </div>
</div>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p style="color: #8b949e; font-weight: 500; letter-spacing: 0.5px;">Initializing Dashboard Workspace...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display: none; opacity: 0; transition: opacity 0.25s ease;">
    
    <h1 id="app-time-heading">TIME</h1>

    <div class="section-buttons">
        <button onclick="loadSection('study', getCurrentGradeSafe())">Study Tracker</button>
        <button onclick="loadSection('timetable')">Weekly Timetable</button>
        <button onclick="loadSection('dashboard')">Dashboard</button>
        <button onclick="loadSection('top-student')">Top Student Mode</button>
        <button onclick="loadSection('sunnah')">Sunnah Tracker</button>
    </div>

    <div id="grade-progress-bar"></div>

    <main id="main-content"></main>

    <div id="grade-nav">
        <button onclick="previousGrade()" id="prev-btn">Previous</button>
        <button onclick="nextGrade()" id="next-btn">Next</button>
    </div>
</div>

<script src="./data.js" defer></script>
<script src="./Study-tracker.js" defer></script>
<script src="./weekly-timetable.js" defer></script>
<script src="./dashboard.js" defer></script>
<script src="./top-student-mode.js" defer></script>
<script src="./Sunnah-tracker.js" defer></script>
<script src="./main.js" defer></script>

<script>
"use strict";

/* ==========================================================
   📦 ARCHITECTURAL GLOBAL STATE CONTROL KEYS
   ========================================================== */
let deferredPrompt = null;
let isRefreshing = false;

/* ==========================================================
   📱 ELITE NATIVE STANDALONE REALM DETECTION
   ========================================================== */
function isRunningStandalone() {
    const isStandaloneMode = window.matchMedia("(display-mode: standalone)").matches ||
                             window.matchMedia("(display-mode: fullscreen)").matches ||
                             window.matchMedia("(display-mode: minimal-ui)").matches;
                             
    const isNavStandalone = window.navigator.standalone === true;
    const isAndroidReferrer = document.referrer.includes("android-app://");
    
    // Fallback: Check inner window constraints to filter out home screen instances
    const isPWAWindow = (window.screen.height - window.innerHeight < 120);

    return (isStandaloneMode || isNavStandalone || isAndroidReferrer || isPWAWindow);
}

function getCurrentGradeSafe() {
    return window.UI?.currentGrade || 9;
}

/* ==========================================================
   ⚙️ PROFESSIONAL BANNER CONTROLLER LOGIC
   ========================================================== */
function showInstallBanner() {
    const banner = document.getElementById("pwa-install-banner");
    if (!banner || isRunningStandalone() || sessionStorage.getItem("pwa-banner-dismissed") === "true") {
        hideInstallBanner();
        return;
    }
    banner.style.pointerEvents = "auto";
    banner.style.transform = "translateX(-50%) translateY(0)";
}

function hideInstallBanner() {
    const banner = document.getElementById("pwa-install-banner");
    if (!banner) return;
    banner.style.transform = "translateX(-50%) translateY(-150%)";
    banner.style.pointerEvents = "none";
}

/* ==========================================================
   🛑 INTERCEPT AUTOMATIC BROWSER INSTALLATION BLOCKS
   ========================================================== */
window.addEventListener("beforeinstallprompt", (e) => {
    // Stop random default browser bottom card sheets from firing
    e.preventDefault();
    
    // Defensive check: If already installed on the device, break deployment instantly
    if (isRunningStandalone()) {
        hideInstallBanner();
        return false;
    }

    deferredPrompt = e;
    showInstallBanner();
    return false;
});

function setupInstallBannerListeners() {
    const actionBtn = document.getElementById("pwa-action-btn");
    const closeBtn = document.getElementById("pwa-close-btn");

    if (closeBtn) {
        closeBtn.addEventListener("click", () => {
            sessionStorage.setItem("pwa-banner-dismissed", "true");
            hideInstallBanner();
        });
    }

    if (actionBtn) {
        actionBtn.addEventListener("click", async () => {
            if (!deferredPrompt) {
                hideInstallBanner();
                return;
            }
            try {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                console.log("📲 PWA installation outcome recorded:", result.outcome);
                deferredPrompt = null;
                hideInstallBanner();
            } catch (err) {
                console.error("🔥 Installation system error encountered:", err);
            }
        });
    }
}

window.addEventListener("appinstalled", () => {
    console.log("🚀 Application environment bound directly to local workspace successfully.");
    deferredPrompt = null;
    hideInstallBanner();
});

/* ==========================================================
   ⏳ HARDWARE ACCELERATED SPLASH TRANSITION VIEW
   ========================================================== */
function hideSplashScreen() {
    const splash = document.getElementById("splash-screen");
    const app = document.getElementById("app");
    if (!splash || !app) return;

    splash.classList.add("hide");
    app.style.display = "block";
    
    setTimeout(() => {
        app.style.opacity = "1";
    }, 50);

    setTimeout(() => {
        if (splash.parentNode) {
            splash.remove();
        }
    }, 300);
}

/* ==========================================================
   🌐 ENTERPRISE SERVICE WORKER SYNC CONTROL
   ========================================================== */
async function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) {
        console.warn("⚠️ System does not support background worker thread mappings.");
        return;
    }
    try {
        const registration = await navigator.serviceWorker.register(
            "./service-worker.js",
            { scope: "./" }
        );
        console.log("🎯 Service Worker scope active:", registration.scope);

        // Silent automated core background upgrade listener (Every 30 mins)
        setInterval(() => {
            if (navigator.onLine) {
                registration.update().catch(() => console.log("SW Sync skipped while working offline."));
            }
        }, 1000 * 60 * 30);

    } catch (err) {
        console.error("❌ Service Worker registration failure:", err);
    }
}

// Single active event loop handle to keep controller sync linear
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (isRefreshing) return;
        isRefreshing = true;
        window.location.reload();
    });
}

/* ==========================================================
   🚀 FRAMEWORK PIPELINE BOOTSTRAP INITIALIZATION
   ========================================================== */
window.addEventListener("DOMContentLoaded", async () => {
    try {
        setupInstallBannerListeners();

        if (isRunningStandalone()) {
            hideInstallBanner();
        }
        
        await registerServiceWorker();
        setTimeout(hideSplashScreen, 450);
        console.log("🔥 Production bootstrap successfully initialized.");
    } catch (err) {
        console.error("🛑 Operational startup aborted:", err);
    }
});
</script>
</body>
</html>
