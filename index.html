<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    />
    <title>Mission App</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <meta name="theme-color" content="#0b0f14" />
    <meta name="background-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission App">
    <meta name="application-name" content="Mission App">
    <meta name="format-detection" content="telephone=no">

    <style>
        html, body {
            background-color: #0b0f14 !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p style="color: #8b949e; font-weight: 500; letter-spacing: 0.5px;">Initializing Dashboard Workspace...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display: none; opacity: 0; transition: opacity 0.25s ease;">
    
    <h1 id="app-time-heading">MISSION</h1>

    <div id="app-navigation-container" class="section-buttons">
        <button data-target="study">Study Tracker</button>
        <button data-target="timetable">Weekly Timetable</button>
        <button data-target="dashboard">Dashboard</button>
        <button data-target="top-student">Top Student Mode</button>
        <button data-target="sunnah">Sunnah Tracker</button>
    </div>

    <div style="width: 100%; box-sizing: border-box; padding: 0 4px;">
        <div id="grade-progress-bar"></div>
    </div>

    <main id="main-content"></main>

    <div id="grade-nav">
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
    </div>
</div>

<script src="cordova.js"></script>

<script src="./data.js"></script>
<script src="./Storage-bridge.js"></script> <script src="./Study-tracker.js"></script>
<script src="./weekly-timetable.js"></script>
<script src="./dashboard.js"></script>
<script src="./top-student-mode.js"></script>
<script src="./Sunnah-tracker.js"></script>
<script src="./main.js"></script>

<script>
"use strict";

/* ==========================================================
   📦 ARCHITECTURAL GLOBAL STATE CONTROL KEYS
   ========================================================== */
let deferredPrompt = null;
let isRefreshing = false;

/* ==========================================================
   📱 ELITE NATIVE STANDALONE REALM DETECTION
   ========================================================== */
function isRunningStandalone() {
    if (window.cordova) return true;

    const isStandaloneMode = window.matchMedia("(display-mode: standalone)").matches ||
                             window.matchMedia("(display-mode: fullscreen)").matches ||
                             window.matchMedia("(display-mode: minimal-ui)").matches;
                             
    const isNavStandalone = window.navigator.standalone === true;
    const isAndroidReferrer = document.referrer.includes("android-app://");
    const isPWAQuery = window.location.search.includes("utm_source=pwa");
    const isPWAWindow = (window.screen.height - window.innerHeight < 120);

    return (isStandaloneMode || isNavStandalone || isAndroidReferrer || isPWAQuery || isPWAWindow);
}

function getCurrentGradeSafe() {
    if (window.UI && typeof window.UI.currentGrade !== 'undefined') {
        return window.UI.currentGrade;
    }
    
    // Integrates seamlessly with your unified cross-platform engine layout
    if (window.Storage && typeof window.Storage.get === "function") {
        const state = window.Storage.get("ui_state", {});
        return Number(state.grade) || 9;
    }

    try {
        const saved = JSON.parse(localStorage.getItem("ui_state"));
        if (saved && saved.grade) {
            return Number(saved.grade) || 9;
        }
    } catch (e) {
        console.warn("Direct storage fallback preview evaluation failed:", e);
    }
    return 9; 
}

/* ==========================================================
   🛑 INTERCEPT AUTOMATIC BROWSER INSTALLATION BLOCKS
========================================================== */
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    if (isRunningStandalone()) return false;
    deferredPrompt = e;
    // Auto-popups removed to eliminate input focus clipping bugs on high-end mobile devices
    return false;
});

window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
});

/* ==========================================================
   ⏳ HARDWARE ACCELERATED SPLASH TRANSITION VIEW
========================================================== */
function hideSplashScreen() {
    const splash = document.getElementById("splash-screen");
    const app = document.getElementById("app");
    if (!splash || !app) return;

    splash.classList.add("hide");
    app.style.display = "block";
    
    if (typeof window.loadSection === "function") {
        window.loadSection("study", getCurrentGradeSafe());
    }
    
    setTimeout(() => {
        app.style.opacity = "1";
    }, 50);

    setTimeout(() => {
        if (splash.parentNode) splash.remove();
    }, 300);
}

/* ==========================================================
   🌐 ENTERPRISE SERVICE WORKER SYNC CONTROL
========================================================== */
async function registerServiceWorker() {
    if (window.cordova || !("serviceWorker" in navigator)) {
        return;
    }
    try {
        const registration = await navigator.serviceWorker.register("./service-worker.js");
        setInterval(() => {
            if (navigator.onLine) {
                registration.update().catch(() => console.log("SW Sync skipped working offline."));
            }
        }, 1000 * 60 * 30);
    } catch (err) {
        console.error("❌ Service Worker registration failure:", err);
    }
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (isRefreshing) return;
        isRefreshing = true;
        window.location.reload();
    });
}

/* ==========================================================
   🛠️ SECURE CENTRAL ROUTER EVENT DELEGATION
========================================================== */
function initializeNavigationListeners() {
    const navContainer = document.getElementById("app-navigation-container");
    if (navContainer) {
        navContainer.addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn || !btn.dataset.target) return;
            
            const target = btn.dataset.target;
            if (typeof window.loadSection === "function") {
                if (target === "study") {
                    window.loadSection("study", getCurrentGradeSafe());
                } else {
                    window.loadSection(target);
                }
            }
        });
    }

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    if (prevBtn) {
        prevBtn.addEventListener("click", () => {
            if (typeof window.previousGrade === "function") window.previousGrade();
        });
    }
    if (nextBtn) {
        nextBtn.addEventListener("click", () => {
            if (typeof window.nextGrade === "function") window.nextGrade();
        });
    }
}

/* ==========================================================
   🚀 FRAMEWORK PIPELINE BOOTSTRAP INITIALIZATION
========================================================== */
window.addEventListener("DOMContentLoaded", async () => {
    try {
        initializeNavigationListeners();
        await registerServiceWorker();
        
        if (window.cordova) {
            document.addEventListener("deviceready", () => {
                setTimeout(hideSplashScreen, 350);
            }, false);
        } else {
            setTimeout(hideSplashScreen, 350);
        }
    } catch (err) {
        console.error("🛑 Operational startup aborted:", err);
    }
});
</script>
</body>
</html>
