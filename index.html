<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<title>Mission App</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0b0f14" />

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission App">

<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<link rel="stylesheet" href="./styles.css" />

</head>

<body>

<button id="installBtn" style="
position: fixed;
bottom: 20px;
right: 20px;
padding: 12px 16px;
border: none;
background: #00d4ff;
color: black;
font-weight: bold;
border-radius: 10px;
display: none;
z-index: 9999;
cursor: pointer;
">
Install App
</button>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p>Loading...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display:none;">

    <h1>TIME</h1>

    <div class="section-buttons">
        <button onclick="loadSection('study', getCurrentGradeSafe())">Study Tracker</button>
        <button onclick="loadSection('timetable')">Weekly Timetable</button>
        <button onclick="loadSection('dashboard')">Dashboard</button>
        <button onclick="loadSection('top-student')">Top Student Mode</button>
        <button onclick="loadSection('sunnah')">Sunnah Tracker</button>
    </div>

    <div id="grade-progress-bar"></div>

    <div id="main-content"></div>

    <div id="grade-nav">
        <button onclick="previousGrade()" id="prev-btn">Previous</button>
        <button onclick="nextGrade()" id="next-btn">Next</button>
    </div>

</div>

<script src="./data.js" defer></script>
<script src="./Study-tracker.js" defer></script>
<script src="./weekly-timetable.js" defer></script>
<script src="./dashboard.js" defer></script>
<script src="./top-student-mode.js" defer></script>
<script src="./Sunnah-tracker.js" defer></script>
<script src="./main.js" defer></script>

<script>
"use strict";

let deferredPrompt = null;

/* =========================
   FIXED PWA DETECTION
========================= */
function isRunningStandalone() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
    );
}

/* =========================
   INSTALL PROMPT FIX (IMPORTANT)
========================= */
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();

    // DO NOT block prompt too early (fixes Chrome bug)
    deferredPrompt = e;

    const btn = document.getElementById("installBtn");

    if (btn && !isRunningStandalone()) {
        btn.style.display = "block";
    }
});

/* =========================
   INSTALL BUTTON
========================= */
function setupInstallButton() {
    const installBtn = document.getElementById("installBtn");
    if (!installBtn) return;

    installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;

        deferredPrompt.prompt();
        await deferredPrompt.userChoice;

        deferredPrompt = null;
        installBtn.style.display = "none";
    });
}

/* =========================
   AFTER INSTALL
========================= */
window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    const btn = document.getElementById("installBtn");
    if (btn) btn.style.display = "none";
});

/* =========================
   BOOT
========================= */
window.addEventListener("DOMContentLoaded", () => {

    const btn = document.getElementById("installBtn");
    if (btn && isRunningStandalone()) btn.style.display = "none";

    setupInstallButton();

    const splash = document.getElementById("splash-screen");
    const app = document.getElementById("app");

    setTimeout(() => {
        if (splash) {
            splash.classList.add("hide");
            setTimeout(() => {
                splash.remove();
                if (app) app.style.display = "block";
            }, 250);
        }
    }, 500);
});

/* =========================
   SERVICE WORKER (FIXED FOR GITHUB PAGES)
========================= */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
        try {
            const reg = await navigator.serviceWorker.register("./service-worker.js", {
                scope: "./"
            });

            console.log("SW registered:", reg.scope);
        } catch (err) {
            console.error("SW failed:", err);
        }
    });
}

</script>

</body>
</html>
