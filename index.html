<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<title>Mission App</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0b0f14" />
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission App">

<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<link rel="stylesheet" href="./styles.css" />

</head>

<body>

<button id="installBtn" style="
position: fixed;
bottom: 20px;
right: 20px;
padding: 12px 16px;
border: none;
background: #00d4ff;
color: black;
font-weight: bold;
border-radius: 10px;
display: none;
z-index: 9999;
cursor: pointer;
">
Install App
</button>

<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p>Loading...</p>
        <div class="loader"></div>
    </div>
</div>

<div id="app" style="display:none;">

    <h1>TIME</h1>

    <div class="section-buttons">
        <button onclick="loadSection('study', getCurrentGradeSafe())">Study Tracker</button>
        <button onclick="loadSection('timetable')">Weekly Timetable</button>
        <button onclick="loadSection('dashboard')">Dashboard</button>
        <button onclick="loadSection('top-student')">Top Student Mode</button>
        <button onclick="loadSection('sunnah')">Sunnah Tracker</button>
    </div>

    <div id="grade-progress-bar"></div>

    <div id="main-content"></div>

    <div id="grade-nav">
        <button onclick="previousGrade()" id="prev-btn">Previous</button>
        <button onclick="nextGrade()" id="next-btn">Next</button>
    </div>

</div>

<script src="./data.js"></script>
<script src="./Study-tracker.js"></script>
<script src="./weekly-timetable.js"></script>
<script src="./dashboard.js"></script>
<script src="./top-student-mode.js"></script>
<script src="./Sunnah-tracker.js"></script>
<script src="./main.js"></script>

<script>

"use strict";

let deferredPrompt = null;

/* =========================
   STANDALONE DETECTION (IMPROVED)
========================= */
function isRunningStandalone() {
    return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true ||
        document.referrer.includes("android-app://")
    );
}

/* =========================
   SAFE GRADE
========================= */
function getCurrentGradeSafe() {
    return window.UI?.currentGrade || 9;
}

/* =========================
   BEFORE INSTALL (IMPROVED RELIABILITY)
========================= */
window.addEventListener("beforeinstallprompt", (e) => {

    // REQUIRED for Chrome PWA
    e.preventDefault();

    if (isRunningStandalone()) return;

    deferredPrompt = e;

    const btn = document.getElementById("installBtn");

    if (btn) btn.style.display = "block";

    console.log("✅ PWA install prompt captured");
});

/* =========================
   INSTALL BUTTON
========================= */
function setupInstallButton() {

    const installBtn = document.getElementById("installBtn");
    if (!installBtn) return;

    installBtn.addEventListener("click", async () => {

        if (!deferredPrompt) {
            alert("Install not ready yet. Open app for a few seconds.");
            return;
        }

        deferredPrompt.prompt();

        const choice = await deferredPrompt.userChoice;

        console.log("Install result:", choice.outcome);

        deferredPrompt = null;
        installBtn.style.display = "none";
    });
}

/* =========================
   AFTER INSTALL
========================= */
window.addEventListener("appinstalled", () => {

    console.log("✅ App installed successfully");

    deferredPrompt = null;

    const btn = document.getElementById("installBtn");
    if (btn) btn.style.display = "none";
});

/* =========================
   BOOT
========================= */
window.addEventListener("DOMContentLoaded", () => {

    const installBtn = document.getElementById("installBtn");

    if (isRunningStandalone() && installBtn) {
        installBtn.style.display = "none";
    }

    setupInstallButton();

    const splash = document.getElementById("splash-screen");
    const app = document.getElementById("app");

    setTimeout(() => {

        if (splash) {

            splash.classList.add("hide");

            setTimeout(() => {
                splash.remove();
                if (app) app.style.display = "block";
            }, 250);
        }

    }, 500);
});

/* =========================
   SERVICE WORKER (IMPORTANT FIX)
========================= */
if ("serviceWorker" in navigator) {

    window.addEventListener("load", async () => {

        try {

            const reg = await navigator.serviceWorker.register("./service-worker.js", {
                scope: "./"
            });

            console.log("✅ SW Registered:", reg.scope);

        } catch (err) {

            console.error("❌ SW Failed:", err);
        }
    });
}

</script>

</body>
</html>
