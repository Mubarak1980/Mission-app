<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mission App</title>

    <!-- PWA MANIFEST -->
    <link rel="manifest" href="./manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .then(() => console.log("SW registered successfully"))
                    .catch(err => console.error("SW Registration failed:", err));
            });
        }
    </script>

    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission">

    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <div class="splash-content">
        <h1>📘 Mission App</h1>
        <p style="color:#8b949e;font-weight:500;">Initializing Dashboard...</p>
        <div class="loader"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none; opacity:0; transition:opacity .25s ease;">

    <h1 id="app-time-heading">MISSION</h1>

    <!-- TOP NAV (UNCHANGED - KEEP YOUR SYSTEM) -->
    <nav id="app-navigation-container" class="section-buttons">

        <button data-target="study" class="nav-button">Study Tracker</button>
        <button data-target="timetable" class="nav-button">Weekly Timetable</button>
        <button data-target="dashboard" class="nav-button">Dashboard</button>
        <button data-target="topstudent" class="nav-button">Top Student Mode</button>
        <button data-target="sunnah" class="nav-button">Sunnah Tracker</button>

    </nav>

    <!-- PROGRESS -->
    <div id="grade-progress-container"
         style="width:100%;box-sizing:border-box;padding:0 4px;">
        <div id="grade-progress-bar"></div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="main-content"></main>

</div>

<!-- ==========================================================
📱 NEW: BOTTOM NAVIGATION (ADDED - SAFE EXTENSION ONLY)
========================================================== -->

<nav class="bottom-nav" id="bottom-nav">

    <button data-target="study" aria-label="Study Tracker">
        📘
        <span>Study</span>
    </button>

    <button data-target="timetable" aria-label="Weekly Timetable">
        📅
        <span>Plan</span>
    </button>

    <button data-target="dashboard" aria-label="Dashboard">
        📊
        <span>Dashboard</span>
    </button>

    <button data-target="topstudent" aria-label="Top Student Mode">
        🏆
        <span>Top</span>
    </button>

    <button data-target="sunnah" aria-label="Sunnah Tracker">
        🕌
        <span>Faith</span>
    </button>

</nav>

<!-- SCRIPTS -->
<script src="./Study-tracker.js"></script>
<script src="./main.js"></script>
<script src="./SmartEngine.js"></script>
<script src="./weekly-timetable.js"></script>
<script src="./dashboard.js"></script>
<script src="./top-student-mode.js"></script>
<script src="./Sunnah-tracker.js"></script>

<script>
"use strict";

/* ==========================================================
🧭 SAFE NAV SYNC (NO BREAKING CHANGES)
========================================================== */
function syncActiveNav(target) {

    document.querySelectorAll("[data-target]")
        .forEach(btn => {
            btn.classList.toggle(
                "active",
                btn.dataset.target === target
            );
        });
}

/* ==========================================================
⚡ BOOT
========================================================== */
window.addEventListener("DOMContentLoaded", () => {

    const nav = document.getElementById("app-navigation-container");
    const bottomNav = document.getElementById("bottom-nav");

    function handleNavClick(e) {
        const btn = e.target.closest("button");
        if (!btn?.dataset.target) return;

        const target = btn.dataset.target;

        syncActiveNav(target);

        window.loadSection(target, window.UI.load().grade);
    }

    nav?.addEventListener("click", handleNavClick);
    bottomNav?.addEventListener("click", handleNavClick);

    const waitForSystem = () => {

        const ready =
            window.DataService &&
            window.maxPagesByGrade &&
            window.SmartEngine &&
            typeof window.loadSection === "function";

        if (!ready) {
            setTimeout(waitForSystem, 50);
            return;
        }

        const splash = document.getElementById("splash-screen");
        const app = document.getElementById("app");

        if (splash && app) {
            splash.style.opacity = "0";

            setTimeout(() => {
                splash.style.display = "none";
                app.style.display = "block";
                app.style.opacity = "1";
            }, 250);
        }

        const last = window.UI.load()?.section || "study";

        syncActiveNav(last);

        window.loadSection(last, window.UI.load().grade);
    };

    waitForSystem();
});
</script>

</body>
    </html>
